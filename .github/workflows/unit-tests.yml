name: unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bats-unit:
    # Circus builds the same flake check for pushes and pull requests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pschmitt/ci-workflows/.github/actions/nix-setup@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - run: nix build '.#checks.x86_64-linux.bats-unit' -L
