name: e2e
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.circus_pr_number != '' && format('Circus PR E2E {0}', inputs.circus_pr_sha) || 'e2e' }}

on:
  push:
  pull_request:
  status:
  workflow_dispatch:
    inputs:
      circus_pr_number:
        description: Trusted pull request number
        type: string
        default: ""
      circus_pr_sha:
        description: Exact trusted pull request head
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'status' && github.event.context == 'circus/artifacts' && github.event.state == 'success' && github.event.sha == github.sha) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Circus artifacts
        if: ${{ github.event_name == 'status' || inputs.circus_pr_number != '' }}
        uses: pschmitt/ci-workflows/.github/actions/verify-circus-artifacts@main
        with:
          pr-number: ${{ inputs.circus_pr_number }}
          pr-sha: ${{ inputs.circus_pr_sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.circus_pr_sha || github.sha }}
          persist-credentials: false

      - uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

      - name: Fetch Circus-built declaroid and bats
        run: |
          nix --option max-jobs 0 --option builders '' --option fallback false --option allow-import-from-derivation false build '.#declaroid' -o result-declaroid
          nix --option max-jobs 0 --option builders '' --option fallback false --option allow-import-from-derivation false build '.#hydraJobs.x86_64-linux.packages.bats' -o result-bats
          echo "$PWD/result-bats/bin" >> "$GITHUB_PATH"
          echo "DECLAROID_BIN=$PWD/result-declaroid/bin/declaroid" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-default-x86_64

      # A separate warm-up run so a cache-miss AVD snapshot (created below)
      # never itself contains any of declaroid's own test side effects.
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run e2e tests on a booted emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bats tests/e2e
