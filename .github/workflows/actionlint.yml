name: actionlint

on:
  push:
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pschmitt/ci-workflows/.github/actions/nix-setup@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - run: nix build '.#checks.x86_64-linux.actionlint' -L
